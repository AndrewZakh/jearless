---
# jearless × auto-version-hook: the version lives in env.yml and rides the
# feature branch. The README invariant ("main moves only by merges") holds:
# main is protected, merge commits are skipped, the bump happens in the branch.

version:
  file: env.yml
  key: version
  parse_regex: '^v(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)$'

# The package version mirrors the flow version (auto-version-hook v1.1.0):
# after every bump both move together; no v-prefix here (PEP 440 style).
version_files:
  - path: pyproject.toml
    regex: '^version = "(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)"$'

git:
  remote: origin
  fetch: true

branch_flow:
  - name: main
    regex: '^main$'
    protected: true    # a direct commit to main never bumps the version
    policy: keep

  - name: feature
    regex: '^feature/' # feature/<project>/<id>-<slug> — the whole README taxonomy
    target: main
    policy: increment
    bump: minor
    reset_lower_parts: false

  - name: fix
    regex: '^fix/'
    target: main
    policy: increment
    bump: patch
    reset_lower_parts: false

  - name: chore
    regex: '^chore/'
    target: main
    policy: ignore

hooks:
  auto_stage: true
  on_error: fail
  skip_merges: true    # does not act on merge commits — the charter moves those
