[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jearless"
version = "0.1.0"
description = "Fearless. Jira-less. Task tracker and changelog on bare git."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pre-commit>=3",
]

[project.scripts]
jear = "jearless.cli:main"
jearless = "jearless.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jearless"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
