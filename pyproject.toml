[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jearless"
version = "0.10.4"
description = "Fearless. Jearless. Task tracking and a changelog on bare git — for small teams."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrei Zakhrebetkov" }]
keywords = ["git", "task-tracking", "changelog", "issue-tracker", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pre-commit>=3",
]

[project.urls]
Homepage = "https://github.com/AndrewZakh/jearless"
Repository = "https://github.com/AndrewZakh/jearless"
Changelog = "https://github.com/AndrewZakh/jearless/blob/main/CHANGELOG.md"
Issues = "https://github.com/AndrewZakh/jearless/issues"

[project.scripts]
jear = "jearless.cli:main"
jearless = "jearless.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jearless"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
