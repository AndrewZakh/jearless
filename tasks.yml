# The eternal jearless task registry (README: frozen facts only, no live state).
# Status is never stored: available = here without a branch; in_progress = a branch
# on origin; done = a merge commit in main. Language is English — the GitHub norm;
# transliteration is only a fallback inside `take`.
tasks:
  tooling:
    - id: 8
      summary: archive — moving done tasks out
      description: |
        By release tag into archive_<tag>.yml, done tasks only,
        triggered by ergonomics (measurement 2026-11-06: speed is not the trigger).
      story_points: 1
    - id: 11
      summary: double-merge resilience — the same branch merged twice after a restore
      description: |
        Scenario: feature/p/N merged, then the branch is restored after a
        local/remote divergence and merged again — main now carries TWO merge
        commits naming the same branch. Audit every derived surface:
        changelog (duplicate entry inside one range; worse — a task re-shipped
        in a later range when its first merge predates from_tag), timeline
        (two bars sharing the mermaid id project_num), retro (dict overwrite —
        the oldest bar currently wins the join; decide explicitly).
        Sprint and doctor are expected safe (set semantics; merges always
        attributed). Hypothesis to implement: dedupe by (project, number)
        keeping the FIRST arrival — a task shipped in the version of its first
        merge; re-merges are artifacts. Test factory: merge, reset/restore,
        merge again, then run every command.
      story_points: 2
    - id: 12
      summary: 'graph — the dependency view: task links and a mermaid flowchart'
      description: |
        depends_on is a frozen authorial fact (the story_points rule): a bare
        number points inside the same project, "project/num" crosses projects.
        Mermaid gantt cannot draw arrows — the view is a flowchart (jear graph),
        a PLAN-side artifact, the gantt contract's sibling, not a timeline
        feature. No gating: a link never blocks take — at most an annotation,
        like the duplicate guard. Validation: targets must exist in the
        registry ∪ archives (archiving cannot orphan a link), cycles refused,
        doctor reports broken links as findings. add gains --depends
        (repeatable); sprint annotates "after p/N".
      story_points: 2
    - id: 13
      summary: 'sprint — markdown dashboard: --write with default path'
      description: |
        The resurrected sprint.md, resolved (it died as a hand-maintained
        cache; it returns as a generated report). Bare sprint stays a PURE
        view — peeking never writes. --write [PATH] targets ./sprint.md by
        default; three cases: file absent — create whole-file with
        jear:sprint markers inside; markers present — replace the chunk only,
        human text around is untouchable; markers absent — refuse with a
        paste-ready snippet (a human file can never be overwritten).
        The chunk carries a stamp: generated-at · git@sha — staleness is
        visible (sha mismatch = the report is stale). Write only on content
        change: a no-op refresh leaves the tree clean. The human commits the
        refresh (nothing automatic writes to main); doctor sanctions
        *.md-only commits as documentation bookkeeping — the accepted price
        (a docs-only squash is invisible) is recorded. Sections with counts,
        points, after-links, branches — the same canonical join, second
        renderer (the changelog/timeline render/run pattern).
      story_points: 2
    - id: 14
      summary: sprint dashboard on every MR — a GitHub Action posting a sticky PR comment
      description: |
        The dashboard rides the forge, not the tree: a pull_request Action
        installs the PR's own jearless (pip install . — the PR tests its own
        tool), renders jear timeline --live (mermaid — GitHub renders it
        directly in comments) plus the sprint board, and maintains ONE sticky
        comment per MR (gh pr comment --edit-last --create-if-none).
        Discussion surface, never a ref move: the "zero CI with write access"
        pros line means code, and is amended in README. sprint.md stays
        human-run. A concurrency group per MR cancels superseded runs;
        fetch-depth 0 so the join reads the full merge history. Bare sprint
        stays a pure view; this is presentation, not state.
      story_points: 2
