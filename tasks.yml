# The eternal jearless task registry (README: frozen facts only, no live state).
# Status is never stored: available = here without a branch; in_progress = a branch
# on origin; done = a merge commit in main. Language is English — the GitHub norm;
# transliteration is only a fallback inside `take`.
tasks:
  tooling:
    - id: 8
      summary: archive — moving done tasks out
      description: |
        By release tag into archive_<tag>.yml, done tasks only,
        triggered by ergonomics (measurement 2026-11-06: speed is not the trigger).
      story_points: 1
    - id: 11
      summary: double-merge resilience — the same branch merged twice after a restore
      description: |
        Scenario: feature/p/N merged, then the branch is restored after a
        local/remote divergence and merged again — main now carries TWO merge
        commits naming the same branch. Audit every derived surface:
        changelog (duplicate entry inside one range; worse — a task re-shipped
        in a later range when its first merge predates from_tag), timeline
        (two bars sharing the mermaid id project_num), retro (dict overwrite —
        the oldest bar currently wins the join; decide explicitly).
        Sprint and doctor are expected safe (set semantics; merges always
        attributed). Hypothesis to implement: dedupe by (project, number)
        keeping the FIRST arrival — a task shipped in the version of its first
        merge; re-merges are artifacts. Test factory: merge, reset/restore,
        merge again, then run every command.
      story_points: 2
    - id: 12
      summary: 'graph — the dependency view: task links and a mermaid flowchart'
      description: |
        depends_on is a frozen authorial fact (the story_points rule): a bare
        number points inside the same project, "project/num" crosses projects.
        Mermaid gantt cannot draw arrows — the view is a flowchart (jear graph),
        a PLAN-side artifact, the gantt contract's sibling, not a timeline
        feature. No gating: a link never blocks take — at most an annotation,
        like the duplicate guard. Validation: targets must exist in the
        registry ∪ archives (archiving cannot orphan a link), cycles refused,
        doctor reports broken links as findings. add gains --depends
        (repeatable); sprint annotates "after p/N".
      story_points: 2
    - id: 13
      summary: 'sprint — markdown dashboard: --write with default path'
      description: |
        The resurrected sprint.md, resolved (it died as a hand-maintained
        cache; it returns as a generated report). Bare sprint stays a PURE
        view — peeking never writes. --write [PATH] targets ./sprint.md by
        default; three cases: file absent — create whole-file with
        jear:sprint markers inside; markers present — replace the chunk only,
        human text around is untouchable; markers absent — refuse with a
        paste-ready snippet (a human file can never be overwritten).
        The chunk carries a stamp: generated-at · git@sha — staleness is
        visible (sha mismatch = the report is stale). Write only on content
        change: a no-op refresh leaves the tree clean. The human commits the
        refresh (nothing automatic writes to main); doctor sanctions
        *.md-only commits as documentation bookkeeping — the accepted price
        (a docs-only squash is invisible) is recorded. Sections with counts,
        points, after-links, branches — the same canonical join, second
        renderer (the changelog/timeline render/run pattern).
      story_points: 2
    - id: 14
      summary: sprint dashboard on every MR — a GitHub Action posting a sticky PR comment
      description: |
        The dashboard rides the forge, not the tree: a pull_request Action
        installs the PR's own jearless (pip install . — the PR tests its own
        tool), renders jear timeline --live (mermaid — GitHub renders it
        directly in comments) plus the sprint board, and maintains ONE sticky
        comment per MR (gh pr comment --edit-last --create-if-none).
        Discussion surface, never a ref move: the "zero CI with write access"
        pros line means code, and is amended in README. sprint.md stays
        human-run. A concurrency group per MR cancels superseded runs;
        fetch-depth 0 so the join reads the full merge history. Bare sprint
        stays a pure view; this is presentation, not state.
      story_points: 2
    - id: 15
      summary: housekeeping — all artifacts under .jearless/ (registry move, resolution order)
      description: |
        Everything jearless writes lives under .jearless/ in the repo root;
        the public face stays out (README and CHANGELOG.md at the root — the
        pyproject Changelog URL is pinned to it; sprint.md --write default
        stays visible). Registry resolution order: .jearless/tasks.yml →
        root tasks.yml → birth in .jearless/. BOTH existing = refuse loudly —
        two live registries are the drift disease, not a migration. Old
        installs keep living at the root with a one-line nudge; migration is
        manual git mv (history preserved, human commit). Archives: read the
        glob over BOTH places (frozen files stay where they were born), write
        new ones into .jearless/. git log -p for scope creep will need
        --follow across the rename. Price accepted: the registry leaves the
        repo front page — the dashboard remains the human face.
      story_points: 2
    - id: 16
      summary: 'planning — the sprint plan contract: plan/sprint_N.yml'
      depends_on:
        - 15
      description: |
        The authored commitment: ids (+ optional per-task planned dates), in
        .jearless/plans/. The file's git birth IS the sprint start — nothing
        stores a date. Numbering = max over plan files + 1, eternal. Hand-
        authored; validated at report/rag time like check_links (unknown ids
        refuse loud). The gantt-of-the-plan is DERIVED from this file — one
        authored plan, no drift with a hand-drawn md gantt (the unification
        decision). Burndown = join of the plan with first-arrival merges
        inside the window. The order of ids may encode execution order —
        this is the sprint priority (see the README manifest).
      story_points: 2
    - id: 17
      summary: report — the release-time PM snapshot (velocity, cycle time, rework)
      depends_on:
        - 15
        - 16
      description: |
        jear report <tag> — the changelog pattern for PM numbers: generated
        at the tag boundary, committed next to it
        (.jearless/reports/report-<tag>.md), into the release step.
        Velocity: points done between tags per subproject — union points via
        load_all (archives!), first-arrival range logic reused. Scope creep:
        tasks born after the plan's git birth (git log --follow). Cycle time:
        median + p85, no mean — start = the branch's first own commit author
        date, end = merge committer date, with the client-clock disclaimer.
        Rework rate: fix-prefix merges / all merges — counts ad-hoc fixes a
        parent field never sees. Attribution: most commits on the branch,
        fallback first-commit committer — derived, nothing stored; reports
        are public, names already are. Label velocity between tags as
        RELEASE velocity; sprint burndown is the plan join — different
        questions.
      story_points: 3
    - id: 18
      summary: RAG — the red-yellow-green view over plan x state, on demand
      depends_on:
        - 16
      description: |
        A derived view over plan x state x depends_on — computed on demand,
        never stored, the one canonical join. Red: a planned task whose
        depends_on target is not done (the existing graph — no blocked_by
        field, rejected as a duplicate carrier). Yellow, two kinds of aging:
        taken-never-started (branch exists, no own commits, branch age > N)
        and stalled (last own commit older than N) — N in [rag] of
        .jearless.toml. Green: in progress, alive. Requires an explicit plan
        argument — which plan is current is never guessed; without a plan
        the RAG does not appear.
      story_points: 2
    - id: 19
      summary: 'take — typed branches: --type fix|chore|feature (default feature)'
      description: |
        take hardcodes feature/ — a registry-recorded bug lands in "Added"
        and escapes the defect ratio. Fix: --type fix|chore|feature (default
        feature) -> the branch prefix. The registry stays typeless: the
        type's only carrier is the branch prefix (one carrier per fact). The
        auto-hotfix hypothesis (unplanned tasks automatically become
        hotfix/) was REJECTED: membership and kind are orthogonal axes; the
        inference bakes a time-of-take judgment into an immutable branch
        name and erases the "production on fire vs calm scope addition"
        distinction. A forgotten type is correctable pre-merge (git branch
        -m) and never after.
      story_points: 1
