# The MR dashboard (task tooling/14, sprint-scoped by tooling/50): the board
# rides the forge, not the tree. The workflow installs the PR's own jearless
# and renders the CURRENT SPRINT's gantt, burn-down and kanban board — mermaid
# renders right in GitHub comments — and keeps ONE sticky comment per MR.
# Discussion surface only — no ref moves, so the "main moves only by merges"
# invariant is untouched; sprint.md stays human-run.

name: sprint dashboard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: sprint-dashboard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the join reads the full merge history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install the PR's own jearless
        run: pip install .

      - name: render the dashboard
        run: |
          PLAN=$(ls .jearless/plans/sprint_*.yml 2>/dev/null | sort -V | tail -1 || true)
          {
            echo "<!-- jear:sprint-dashboard -->"
            echo "## 🐭 jearless — sprint dashboard"
            if [ -n "$PLAN" ]; then
              echo ""
              echo "### The sprint gantt ($(basename "$PLAN"))"
              echo ""
              echo '```mermaid'
              GANTT_RAW=$(jear plan "$PLAN" --gantt)
              GANTT=$(printf '%s\n' "$GANTT_RAW" | sed -n '/^%%{init/,$p')
              echo "${GANTT:-$GANTT_RAW}"
              echo '```'
              echo ""
              echo "### The burn-down"
              echo ""
              echo '```mermaid'
              jear burndown "$PLAN" || echo "(nothing to burn yet)"
              echo '```'
            else
              echo ""
              echo "_no sprint plan committed — the whole-project timeline_"
              echo ""
              echo '```mermaid'
              jear timeline --live
              echo '```'
            fi
            echo ""
            echo "### The board"
            echo ""
            # the public dashboard shows the WHOLE working set — available,
            # done and rejected included; the sprint focus lives in the gantt
            # and the burn-down above (task tooling/50, round 2)
            BOARD=$(jear board --all)
            echo '```mermaid'
            # quote card labels: parens like (2 pt) break GitHub's kanban lexer
            printf '%s\n' "$BOARD" | python3 examples/quote_mermaid_labels.py
            echo '```'
            echo ""
            echo "_generated at $(date -u '+%Y-%m-%d %H:%M UTC') on commit ${GITHUB_SHA::7} — release-time slices live in .jearless/reports/_"
          } > dashboard.md

      - name: post the sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --edit-last --create-if-none --body-file dashboard.md
