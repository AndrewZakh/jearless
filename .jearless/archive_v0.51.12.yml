# Identity for analytics is the union of tasks.yml and the archives (registry.load_all).
tasks:
  tooling:
    - id: 51
      summary: release two-phase — the artifacts ride a PR
      description: |
        The release step stops writing to main even as a sanctioned human-run commit.
        PREPARE: jear release cuts a release/v<ver> branch with the artifacts commit
        (changelog section, snapshot, report), pushes it and opens a PR with hints.
        FINALIZE: after the PR merges, the tag lands on the merge commit (jear release
        --finalize <ver> reads the origin tip). Nothing automatic writes main — now
        without a single exception. The tag-recovery checklist line survives.
      story_points: 3
