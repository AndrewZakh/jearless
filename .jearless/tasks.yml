# The eternal jearless task registry (README: frozen facts only, no live state).
# Status is never stored: available = here without a branch; in_progress = a branch
# on origin; done = a merge commit in main. Language is English — the GitHub norm;
# transliteration is only a fallback inside `take`.
tasks:
  tooling:
    - id: 34
      summary: log — the per-task journal across branches and merges
      description: |
        The task lifecycle is scattered across branches: the feature branch,
        fix re-take branches, the merges into the trunk naming them, the
        dates. `jear log <project> <id>` — one command, the full journal:
        every branch of the task (any kind), its own commits, the merge dates
        into the trunk, sorted oldest first. A retake story reads top to
        bottom: shipped, then the fix branch, then that merge. Source: local
        branches + origin branches + trunk merges filtered by
        `<project>/<id>-`. No state semantics — pure provenance view.
      story_points: 2
    - id: 45
      summary: xcf to Git LFS — version the GIMP logo source
      description: |
        The open fork from the sprint_4 dig: the GIMP working file (layers,
        masks — the true source behind the svg/png exports) lived untracked,
        so the project's face had provenance for its exports but not for its
        source. Options weighed: Git LFS (versioned in-repo; free-tier quota
        holds years for a ~1-2 MB file; clean adoption window while never
        committed), a separate asset repo, or local-only acceptance.
      story_points: 1
      rejected: the hand-authored svg superseded the GIMP source — the xcf is a sketchpad (L1), the system stores results (L3); revisit only if a live GIMP pipeline ever returns
    - id: 46
      summary: next-ID allocation over the union — add collides with archived ids
      story_points: 1
    - id: 47
      summary: report first-arrival by history order — the fix merges first, the swap
      description: |
        The follow-up review P2: _task_merges walks git log in default order (fresh on
        top), so when feature/p/1-a and fix/p/1-a both merge between tags, the fix
        occupies the first-arrival slot and the feature is recorded as the return —
        cycle time and attribution silently read the fix branch. Walk the range
        ancestors-first (--topo-order --reverse) and keep the shipped-before handling;
        audit timeline.merge_bars for the same discipline (burndown and retro take the
        first bar they see). Regression test: both merges between neighboring tags —
        assert the first-arrival sha AND the return sha.
      story_points: 2
    - id: 48
      summary: retro plan stamp — name the version actually read
      description: |
        The follow-up review P2: the retro reads the plan from the working tree but
        stamps plan@ with the birth commit — edit the plan and the membership changes
        while the stamp swears it did not. The birth stays the window origin; when the
        working file is dirty against HEAD, the header says so (+ uncommitted edits).
        Two tests, the review's exact states: dirty edit visible at the same HEAD;
        after commit the stamp points at the commit holding the read version.
      story_points: 2
    - id: 49
      summary: local polish — pre-commit dup check, README take wording, tag recovery
      description: |
        The follow-up review P3 pack: (a) a local pre-commit hook (language: system,
        files: tasks.yml + archive_*.yml) whose entry calls registry.load_all on the
        working tree — duplicate keys fail the commit five seconds before CI does;
        (b) README: a second push of the same commit may come back 'Everything
        up-to-date' — occupancy is advisory, the board shows the truth; (c) release
        checklist: push the EXISTING local tag first (git push origin refs/tags/<tag>),
        create-on-SHA only when the local tag is missing.
      story_points: 1
    - id: 50
      summary: sprint-scoped CI dashboards — GitLab analog and examples
      description: |
        The owner's idea, charter-shaped: dashboards for the CURRENT sprint ride the
        forge, never the tree (the tooling/14 decision, reaffirmed — no commit-backs,
        nothing automatic writes main). Scope: fix our sprint-comment.yml to render the
        current sprint's gantt (jear plan <latest> --gantt) instead of the whole-project
        timeline, plus the sprint burndown and kanban; ship example CI jobs for GitHub
        AND GitLab (MR-note via the API, sticky by search-and-update) rendering the
        current sprint's burndown, gantt and kanban. Reports may also ride pages or job
        artifacts where comments do not exist.
      story_points: 2
