# The eternal jearless task registry (README: frozen facts only, no live state).
# Status is never stored: available = here without a branch; in_progress = a branch
# on origin; done = a merge commit in main. Language is English — the GitHub norm;
# transliteration is only a fallback inside `take`.
tasks:
  tooling:
    - id: 34
      summary: log — the per-task journal across branches and merges
      description: |
        The task lifecycle is scattered across branches: the feature branch,
        fix re-take branches, the merges into the trunk naming them, the
        dates. `jear log <project> <id>` — one command, the full journal:
        every branch of the task (any kind), its own commits, the merge dates
        into the trunk, sorted oldest first. A retake story reads top to
        bottom: shipped, then the fix branch, then that merge. Source: local
        branches + origin branches + trunk merges filtered by
        `<project>/<id>-`. No state semantics — pure provenance view.
      story_points: 2
      rejected: the work landed direct-to-main (scar f98484d, in the ledger) — shipped, scarred, closed; in_progress was the board's lie
    - id: 45
      summary: xcf to Git LFS — version the GIMP logo source
      description: |
        The open fork from the sprint_4 dig: the GIMP working file (layers,
        masks — the true source behind the svg/png exports) lived untracked,
        so the project's face had provenance for its exports but not for its
        source. Options weighed: Git LFS (versioned in-repo; free-tier quota
        holds years for a ~1-2 MB file; clean adoption window while never
        committed), a separate asset repo, or local-only acceptance.
      story_points: 1
      rejected: the hand-authored svg superseded the GIMP source — the xcf is a sketchpad (L1), the system stores results (L3); revisit only if a live GIMP pipeline ever returns
    - id: 67
      summary: 'sprint-{n}: see every unpromoted sprint branch'
      description: |
        The full fix — the limit left by task 66.
        The tool reads ONE integration branch at a time. With a branch per
        sprint, a sprint opened and created before the previous one is
        promoted leaves that previous branch out of view: its tasks drop
        from done, and its merges are missing from the changelog.
        The change: treat every unpromoted branch matching the {n} pattern
        as an integration branch — merges are collected from all of them,
        new tasks fork from the newest, the changelog lists what each still
        owes to the trunk.
        This lifts the manifest's "one intermediate branch at a time": the
        design question is what "done", "reopened" and the unreleased
        changelog mean when several branches are unreleased at once. Settle
        that in the manifest before writing code. Not started; estimate to
        be confirmed once the design is.
      story_points: 5
    - id: 64
      summary: 'trailer attribution — changelog and doctor attribute commits via Task: trailers'
      description: |
        The adopter bridge for squash-mandated orgs (the forge's squash
        button kills the branch name - the task key dies with it). If a
        commit carries a Task: <project>/<id> trailer, changelog/doctor
        attribute it to the task even without a merge commit naming the
        branch. jear message <id> generates the trailer; this task teaches
        the readers. Design round approved 2026-11-24; scoped separately
        from the reporter stack.
        The hostile review's P0 direction (2026-11-28): the merge subject is
        editable in the forge UI and forgeable by hand - the parser reads %B
        (the full body) and attributes via Task: trailers first, keeping the
        subject regexes as the legacy fallback. A configurable merge_regex
        for other forges is consciously deferred - the priority is hardening
        the GitHub mechanics. The tip-commit-in-take variant (take stops
        being zero-commit) is a separate design decision, out of this scope.
      story_points: 2

    - id: 65
      summary: rhythm — the week and month cuts
      description: |
        The calendar lens over landed work: commits per ISO week and per
        month, alongside the hour/weekday maps. For repos without plans
        (reactive inflow) this is the only time axis that exists — velocity
        is release-scoped, weeks/months are calendar-scoped. Author filter
        applies; the labels sort lexicographically = chronologically.
      story_points: 1
      rejected: the work shipped via the registration ride whose merge the taxonomy cannot parse (registry/tooling-65, merged as pull request 34) - the week and month cuts are in main since then; the unit closes, the naming fix is tooling/69
    - id: 70
      summary: validation hardening — the contract holds at the trust boundary
      description: |
        The hostile review's live-reproduced gaps: id: true loads as a task
        (True is an int - the known trap, missed in one spot), story_points
        accepts -7 and 0 (registry and CLI --points), and a hand-edited
        project name (Bad/../Name) loads and later reaches branch
        construction. The contract must hold at the trust boundary - on
        read: bool ids refused, story_points >= 1, project names validated
        by PROJECT_RE at load, --points validated in the CLI.
      story_points: 1
    - id: 71
      summary: polish pack — the hostile review's small findings
      description: |
        The hostile review's small findings, bundled: the unreachable
        "not implemented" tail and the PHASES relic (a missing dispatch
        would die with a bare KeyError, not a JearlessError); the README's
        "one binary" oversell (it is a Python package via pipx); SECURITY.md
        pins the sprint-comment workflow pattern (fork PRs get a read-only
        token - same-repo exposure only, pinned consciously); the sprint
        number resolver reads one for-each-ref instead of N rev-parses.
      story_points: 1
    - id: 72
      summary: CSV formula injection — neutralize in export
      description: |
        A summary starting with =, +, - or @ executes as a formula when the
        CSV export opens in a spreadsheet. The formula is not in git or YAML
        - it is free text a human pasted from mail or a ticket. Low
        severity (needs both a hostile summary and Excel); the export
        neutralizes the leading character. Backlogged by the owner's
        reviewer; recorded here so it is not a blind spot.
      story_points: 1
