# Frozen history: tasks done as of v1.0.0, moved out of tasks.yml by `jear archive v1.0.0`.
# Identity for analytics is the union of tasks.yml and the archives (registry.load_all).
tasks:
  tooling:
    - id: 52
      summary: registry mutations ride PRs — add, reject, archive
      description: |
        add/reject/archive keep staging the edit (the tool never commits) but the
        printed guidance changes: the human opens a PR, not a direct commit. The
        one-sanctioned-direct-write charter clause retires with dignity — its death
        is witnessed by the scar ledger: five of five scars were direct-to-main sins.
      story_points: 1
    - id: 53
      summary: auto-PR via the forge API — labels on, self-opening
      description: |
        The killer feature the owner asked to think through: jear speaks the forge
        natively — gh pr create (GitHub) and the GitLab MR API (curl) open the PR/MR
        themselves, with the right labels (registry, release, sprint) and titles.
        Tokens come from the ambient CLI session or CI variables — never from the
        repo. Fallbacks stay manual: no token, no forge — the hint prints instead.
      story_points: 2
    - id: 54
      summary: the constitution amendment — PR-only main, the 1.0 ceremony
      description: |
        The charter retires the sanctioned-direct-commits clause; the ledger's five
        scars are the witness (blood written by ourselves). The emergency admin-
        bypass valve stays explicit: every use becomes a ledger scar. Platform
        recipes ship as docs: GitHub ruleset (no force-push, no delete, PR-only,
        required checks, merge-commit only) and GitLab (protected branch, MR-only).
        Positioning line lands in the README: jearless works on PURE git — fit for
        embedded and autonomous systems where no human operator exists. Closing
        ceremony: the v1.0.0 tag.
      story_points: 1
